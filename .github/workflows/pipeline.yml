name: Market Report Pipeline

on:
  schedule:
    - cron: '30 11 * * *' # Runs daily at 5:00 PM IST (11:30 UTC)
  workflow_dispatch:
  push:

permissions:
  contents: write  # Allows GitHub Actions to push changes back to the repo

concurrency:
  group: market-report-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pandas numpy requests yfinance

      - name: Generate Market Reports
        run: |
          python Market_messenger.py

      - name: Run Confirmed Trend Report Script
        run: |
          python run_confirmed_trend_report.py

      - name: Commit and Push Report Text Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add *.txt stock_market_data.db
          
          git commit -m "chore: auto-update market intelligence reports [skip ci]" || echo "No changes to commit"

          # Another push may have landed while the pipeline was running; rebase onto it
          # (keeping freshly generated reports on conflict) and retry.
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "Push failed after 3 attempts"
          exit 1
