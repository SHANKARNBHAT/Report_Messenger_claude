name: Panchang wallpaper

on:
  # Just after midnight IST (UTC + 5:30), with a backup before dawn: the phone fetches
  # the image at 5 AM. Odd minutes: GitHub delays or drops scheduled runs most around
  # :00 and :30.
  schedule:
    - cron: '41 18 * * *'  # 12:11 AM IST
    - cron: '13 22 * * *'  # 3:43 AM IST (backup)
  workflow_dispatch:

permissions:
  contents: write  # publishes the image on the panchang branch

concurrency:
  group: panchang
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # NASA's DE421 ephemeris (17 MB), downloaded once.
      - name: Cache the ephemeris
        uses: actions/cache@v4
        with:
          path: .skyfield
          key: skyfield-de421

      - name: Install Dependencies
        run: |
          pip install skyfield pillow

      - name: Draw the Panchang
        run: |
          python panchang_wallpaper.py out/panchang.png

      # A single commit, force-pushed: the branch keeps only today's image, so the
      # repository does not grow. The phone reads it from
      # https://raw.githubusercontent.com/<owner>/<repo>/panchang/panchang.png
      - name: Publish
        working-directory: out
        run: |
          git init -q -b panchang
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add panchang.png
          git commit -q -m "Panchang $(TZ=Asia/Kolkata date '+%d %b %Y')"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" panchang
